[package]
name = "uclone-slices-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Minimal runtime for UClone Slices V2"
publish = false

[dependencies]
age = { version = "0.12.1", default-features = false }
filetime = "0.2.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tar = "0.4.46"
thiserror = "2"
zeroize = "1.8.1"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
