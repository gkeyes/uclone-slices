name: Validate V2

on:
  pull_request:
  push:
    branches: ["main", "codex/**", "claude/**"]
    # A v* tag is pushed only after the user confirms the candidate; it is the only path
    # that publishes a GitHub Release, and it publishes the bytes this run verified.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode fixed release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/uclone-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uclone-signing/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/uclone-signing/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"

      - name: Require fixed release signing
        run: test "$HAS_RELEASE_SIGNING" = "true"

      - name: Resolve Rust toolchain
        run: rustup show active-toolchain

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Build Manager archive helper
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./tools/build-manager-helper.sh

      - name: Validate Android apps
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :manager-app:testDebugUnitTest :manager-app:lintDebug :manager-app:lintRelease :manager-app:assembleRelease :device-fixture-app:lintFromDebug :device-fixture-app:lintToDebug :device-fixture-app:assembleFromDebug :device-fixture-app:assembleToDebug 2>&1 | tee "$RUNNER_TEMP/gradle-android.log"

      # Job logs are not always reachable from where the failure is read; the key lines are
      # repeated as one annotation per source so they show up in the checks API and UI.
      - name: Summarize Android failures
        if: failure()
        run: |
          annotate() {
            message=$(sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            [ -n "$message" ] && printf '::error title=%s::%s\n' "$1" "$message"
            return 0
          }
          if [ -f "$RUNNER_TEMP/gradle-android.log" ]; then
            { grep -E '^e: |^w: .*error|What went wrong|> Task .* FAILED|FAILED$|Lint found|Error: |Exception|expected:' \
              "$RUNNER_TEMP/gradle-android.log" || true; } | head -n 80 | annotate "Gradle"
          fi
          for report in manager-app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$report" ] || continue
            { grep -A4 '<failure' "$report" || true; } | head -n 30
          done | annotate "Unit tests"
          for report in manager-app/build/reports/lint-results-*.txt manager-app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt; do
            [ -f "$report" ] || continue
            { grep -B1 -A2 'Error' "$report" || true; } | head -n 60
          done | annotate "Lint"

      - name: Validate KernelSU startup layer
        run: |
          ./tools/check-decision-alignment.sh
          ./tools/test-kernelsu.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./tools/build-kernelsu.sh

      - name: Verify fixed Manager signature
        run: |
          test "$(unzip -p manager-app/build/outputs/apk/release/manager-app-release.apk lib/arm64-v8a/libuclone_archive.so | sha256sum | awk '{print $1}')" = "$(cat outputs/helpers/uclone_archive.sha256)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            ./tools/verify-release-signing.sh \
            manager-app/build/outputs/apk/release/manager-app-release.apk

      - name: Prepare SHA-pinned delivery bundle
        run: |
          DELIVERY="$RUNNER_TEMP/uclone-slices-delivery"
          mkdir -p "$DELIVERY"
          install -m 0644 manager-app/build/outputs/apk/release/manager-app-release.apk "$DELIVERY/uclone-slices-v2-manager-0.2.3-${GITHUB_SHA}.apk"
          install -m 0644 outputs/uclone-slices-v2-kernelsu.zip "$DELIVERY/uclone-slices-v2-kernelsu-0.2.3-${GITHUB_SHA}.zip"
          (cd "$DELIVERY" && sha256sum ./*.apk ./*.zip > SHA256SUMS.txt)

      - name: Upload 0.2.3 candidate delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uclone-slices-v2-0.2.3-${{ github.sha }}
          path: ${{ runner.temp }}/uclone-slices-delivery
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - name: Download verified delivery
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uclone-slices-v2-0.2.3-${{ github.sha }}
          path: ${{ runner.temp }}/uclone-slices-delivery

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DELIVERY: ${{ runner.temp }}/uclone-slices-delivery
        run: |
          test "$TAG" = "v0.2.3"
          NOTES="docs/releases/$TAG.md"
          test -s "$NOTES"
          (cd "$DELIVERY" && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "UClone Slices V2 $TAG" \
            --notes-file "$NOTES" \
            "$DELIVERY"/*.apk "$DELIVERY"/*.zip "$DELIVERY"/SHA256SUMS.txt
