name: CI

on:
  pull_request:
  push:
    branches: ["main", "codex/**", "claude/**"]
    # A v* tag is pushed only after the user confirms the candidate; it is the only path
    # that publishes a GitHub Release, and it publishes the bytes this run verified.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is useless; branch and tag runs produce deliveries, so they always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Pull requests never see the release key, even from branches of this repository: PR code is
      # unreviewed. Branch and tag pushes sign with it and must have it.
      HAS_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check version alignment and KernelSU scripts
        run: |
          ./tools/check-decision-alignment.sh
          ./tools/test-kernelsu.sh

      - name: Read release version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' manager-app/build.gradle.kts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode fixed release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/uclone-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uclone-signing/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/uclone-signing/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"

      # Every branch or tag push must produce the fixed-certificate delivery.
      - name: Require fixed release signing
        if: github.event_name != 'pull_request'
        run: test "$HAS_RELEASE_SIGNING" = "true"

      - name: Resolve Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Build Manager archive helper
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./tools/build-manager-helper.sh

      - name: Validate Android apps
        env:
          RELEASE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon --console=plain :manager-app:testDebugUnitTest :manager-app:lintRelease :manager-app:assembleRelease :device-fixture-app:lintFromDebug :device-fixture-app:lintToDebug :device-fixture-app:assembleFromDebug :device-fixture-app:assembleToDebug

      - name: Upload Android reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            manager-app/build/reports
            manager-app/build/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build KernelSU module
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./tools/build-kernelsu.sh

      - name: Verify fixed Manager signature
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          test "$(unzip -p manager-app/build/outputs/apk/release/manager-app-release.apk lib/arm64-v8a/libuclone_archive.so | sha256sum | awk '{print $1}')" = "$(cat outputs/helpers/uclone_archive.sha256)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            ./tools/verify-release-signing.sh \
            manager-app/build/outputs/apk/release/manager-app-release.apk

      - name: Prepare SHA-pinned delivery bundle
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DELIVERY="$RUNNER_TEMP/uclone-slices-delivery"
          mkdir -p "$DELIVERY"
          install -m 0644 manager-app/build/outputs/apk/release/manager-app-release.apk "$DELIVERY/uclone-slices-manager-${VERSION}-${GITHUB_SHA}.apk"
          install -m 0644 outputs/uclone-slices-v2-kernelsu.zip "$DELIVERY/uclone-slices-kernelsu-${VERSION}-${GITHUB_SHA}.zip"
          (cd "$DELIVERY" && sha256sum ./*.apk ./*.zip > SHA256SUMS.txt)

      - name: Upload candidate delivery
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uclone-slices-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/uclone-slices-delivery
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - name: Download verified delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uclone-slices-${{ needs.validate.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/uclone-slices-delivery

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          DELIVERY: ${{ runner.temp }}/uclone-slices-delivery
        run: |
          test "$TAG" = "v$VERSION"
          NOTES="docs/releases/$TAG.md"
          test -s "$NOTES"
          (cd "$DELIVERY" && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "UClone Slices $TAG" \
            --notes-file "$NOTES" \
            "$DELIVERY"/*.apk "$DELIVERY"/*.zip "$DELIVERY"/SHA256SUMS.txt
