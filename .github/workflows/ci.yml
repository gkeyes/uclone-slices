name: Validate V2

on:
  pull_request:
  push:
    branches: ["main", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_ALIAS != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode fixed release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/uclone-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uclone-signing/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/uclone-signing/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"

      - name: Require fixed release signing
        run: test "$HAS_RELEASE_SIGNING" = "true"

      - name: Resolve Rust toolchain
        run: rustup show active-toolchain

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Build Manager archive helper
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./tools/build-manager-helper.sh

      - name: Validate Android apps
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :manager-app:testDebugUnitTest :manager-app:lintDebug :manager-app:lintRelease :manager-app:assembleRelease :device-fixture-app:lintFromDebug :device-fixture-app:lintToDebug :device-fixture-app:assembleFromDebug :device-fixture-app:assembleToDebug

      - name: Validate KernelSU startup layer
        run: |
          ./tools/check-decision-alignment.sh
          ./tools/test-kernelsu.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./tools/build-kernelsu.sh

      - name: Verify fixed Manager signature
        run: |
          test "$(unzip -p manager-app/build/outputs/apk/release/manager-app-release.apk lib/arm64-v8a/libuclone_archive.so | sha256sum | awk '{print $1}')" = "$(cat outputs/helpers/uclone_archive.sha256)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            ./tools/verify-release-signing.sh \
            manager-app/build/outputs/apk/release/manager-app-release.apk

      - name: Prepare SHA-pinned delivery bundle
        run: |
          DELIVERY="$RUNNER_TEMP/uclone-slices-delivery"
          mkdir -p "$DELIVERY"
          install -m 0644 manager-app/build/outputs/apk/release/manager-app-release.apk "$DELIVERY/uclone-slices-v2-manager-0.2.2-${GITHUB_SHA}.apk"
          install -m 0644 outputs/uclone-slices-v2-kernelsu.zip "$DELIVERY/uclone-slices-v2-kernelsu-0.2.2-${GITHUB_SHA}.zip"
          (cd "$DELIVERY" && sha256sum ./*.apk ./*.zip > SHA256SUMS.txt)

      - name: Upload 0.2.2 candidate delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uclone-slices-v2-0.2.2-${{ github.sha }}
          path: ${{ runner.temp }}/uclone-slices-delivery
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
