name: Build Slots Preview Bundle

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slots-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Rust 1.95
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --component rustfmt
          --component clippy
          --target aarch64-linux-android

      - name: Require fixed release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/uclone-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uclone-signing/release.p12"
          chmod 0600 "$RUNNER_TEMP/uclone-signing/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/uclone-signing/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"

      - name: Calculate monotonic Preview version
        run: |
          echo "PREVIEW_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION_NAME=0.2.0-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test and lint Slots manager
        run: >-
          gradle --no-daemon
          :slot-manager-app:testDebugUnitTest
          :slot-manager-app:lintRelease

      - name: Test generic Runtime safety core
        run: |
          install -d -m 0700 "$RUNNER_TEMP/uclone-rust-tests"
          export TMPDIR="$RUNNER_TEMP/uclone-rust-tests"
          cargo +1.95.0 fmt --manifest-path slot-runtime/Cargo.toml --all -- --check
          cargo +1.95.0 test --manifest-path slot-runtime/Cargo.toml --locked --all-targets --all-features -- --skip fake_ce_de_switch_stress_keeps_one_mount_pair_and_valid_chain --test-threads=1
          cargo +1.95.0 clippy --manifest-path slot-runtime/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo +1.95.0 doc --manifest-path slot-runtime/Cargo.toml --locked --no-deps --all-features
          tools/test-target-profiles.sh
          tools/test-generic-emergency-once.sh
          tools/test-generic-rescue.sh

      - name: Build generic Android Runtime
        env:
          UCLONE_TARGET_PROFILE: generic
        run: |
          PROFILE_ROOT="$GITHUB_WORKSPACE/slot-runtime/target-profiles/generic"
          mkdir -p "$PROFILE_ROOT/profile"
          tools/render-target-profile.sh generic "$PROFILE_ROOT/profile"
          export CARGO_TARGET_DIR="$PROFILE_ROOT"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          cargo +1.95.0 build \
            --manifest-path slot-runtime/Cargo.toml \
            --locked \
            --release \
            --target aarch64-linux-android \
            --bins

      - name: Build generic PackageManager Bridge
        run: >-
          gradle --no-daemon -p slot-bridge
          testReleaseUnitTest
          lintRelease
          appProcessArtifact
          -PtargetProfile=generic

      - name: Build generic filesystem probe
        run: >-
          make -C slot-fsprobe
          TARGET_PROFILE=generic
          ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          test android-check

      - name: Package and test generic KernelSU Runtime
        run: |
          PACKAGE_ROOT="$RUNNER_TEMP/kernelsu-package"
          tools/package-kernelsu-preview.sh --profile generic --output "$PACKAGE_ROOT"
          tools/test-kernelsu-boot-flow.sh --profile generic
          test -f "$PACKAGE_ROOT/uclone-slices-preview-kernelsu.zip"
          unzip -p "$PACKAGE_ROOT/uclone-slices-preview-kernelsu.zip" target-profile.sh | \
            grep -F "UCLONE_TARGET_PROFILE='generic'"
          unzip -p "$PACKAGE_ROOT/uclone-slices-preview-kernelsu.zip" module.prop | \
            grep -F 'version=0.2.0-preview.2'
          unzip -p "$PACKAGE_ROOT/uclone-slices-preview-kernelsu.zip" bin/slotctl | \
            strings | grep -F 'rpc'
          echo "KERNELSU_PACKAGE_ROOT=$PACKAGE_ROOT" >> "$GITHUB_ENV"

      - name: Assemble fixed-signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon
          :slot-manager-app:assembleRelease
          -PpreviewVersionCode="$PREVIEW_VERSION_CODE"
          -PpreviewVersionName="$PREVIEW_VERSION_NAME"

      - name: Verify package, signature, and certificate
        run: |
          APK="slot-manager-app/build/outputs/apk/release/slot-manager-app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.uclone.slots.preview'" "$RUNNER_TEMP/badging.txt"
          ACTUAL_CERT="$(awk -F ': ' '/certificate SHA-256 digest/ {print toupper($2); exit}' "$RUNNER_TEMP/apksigner.txt")"
          EXPECTED_CERT="$(tr -d '[:space:]' < signing/UCLONE_SLICES_PREVIEW_CERT_SHA256)"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

      - name: Prepare downloadable artifact
        run: |
          install -d dist
          install -m 0644 \
            slot-manager-app/build/outputs/apk/release/slot-manager-app-release.apk \
            dist/uclone-slots-preview.apk
          install -m 0644 \
            "$KERNELSU_PACKAGE_ROOT/uclone-slices-preview-kernelsu.zip" \
            dist/uclone-slices-preview-kernelsu.zip
          install -m 0644 \
            "$KERNELSU_PACKAGE_ROOT/manifest.txt" \
            dist/KERNELSU-MANIFEST.txt
          (
            cd dist
            sha256sum \
              uclone-slots-preview.apk \
              uclone-slices-preview-kernelsu.zip > SHA256SUMS
          )
          cp "$RUNNER_TEMP/apksigner.txt" dist/APK-SIGNATURE.txt
          cp "$RUNNER_TEMP/badging.txt" dist/APK-BADGING.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: uclone-slots-preview-bundle-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Preview release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "preview-build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            dist/uclone-slots-preview.apk \
            dist/uclone-slices-preview-kernelsu.zip \
            dist/SHA256SUMS \
            dist/APK-SIGNATURE.txt \
            dist/KERNELSU-MANIFEST.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "UClone Slices Preview build ${GITHUB_RUN_NUMBER}" \
            --notes "Paired fixed-signed APK and generic KernelSU Runtime from commit ${GITHUB_SHA}. Install the ZIP through KernelSU; the packaged disable marker keeps a fresh module disabled until explicitly enabled."
